<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Favicon: the mark scaled up to 88% and nudged so it fills the tab square.
       Star kept gold at every size — it is the one thing that survives at 16px. -->
  <style>
    .ring { stroke: #1478C8; } .cloud { fill: #1478C8; } .star { fill: #F2B231; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #6FB8F0; } .cloud { fill: #6FB8F0; } .star { fill: #FBC65A; }
    }
  </style>
  <g transform="translate(32 33) scale(1.1) translate(-32 -32)">
