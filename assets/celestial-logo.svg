<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72" role="img" aria-label="Celestial Weather">
  <title>Celestial Weather</title>
  <!-- Horizontal lockup. The wordmark uses live text so it stays editable and
       crisp on the web; convert it to outlines before sending this file to a
       printer or anywhere the font stack is not guaranteed. -->
  <style>
    .ring { stroke: #1478C8; }
    .cloud { fill: #1478C8; }
    .star { fill: #F2B231; }
    .name { fill: #1478C8; font: 600 34px/1 ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; letter-spacing: -1.2px; }
    .sub  { fill: #5B7183; font: 500 11px/1 ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; letter-spacing: 4.4px; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #4FA6E8; } .cloud { fill: #4FA6E8; }
      .star { fill: #FBC65A; } .name { fill: #4FA6E8; } .sub { fill: #93A7B8; }
    }
  </style>

  <g transform="translate(4 4)">
    <path class="ring" d="M32 9 A17 17 0 1 1 16.02 20.19" fill="none" stroke-width="4.4" stroke-linecap="round"/>
    <path class="star" d="M22.2 6.1 Q23.1 11.2 28.2 12.1 Q23.1 13 22.2 18.1 Q21.3 13 16.2 12.1 Q21.3 11.2 22.2 6.1 Z"/>
    <g class="cloud">
      <circle cx="17" cy="44" r="9.5"/>
      <circle cx="32" cy="40" r="12.5"/>
      <circle cx="45.4" cy="44.5" r="9"/>
      <rect x="17" y="44" width="28.4" height="9.5"/>
    </g>
  </g>

  <text class="name" x="84" y="38">Celestial</text>
  <text class="sub" x="86" y="56">WEATHER</text>
</svg>
